services:
  rclone-manager:
    image: ghcr.io/zarestia-dev/rclone-manager:latest
    container_name: rclone-manager
    restart: unless-stopped
    ports:
      - "127.0.0.1:8099:8080"
    environment:
      - PUID=1000
      - PGID=1000
    volumes:
      - /appdata/rclone-manager/data:/data
      - /appdata/rclone-manager/config:/config
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:8080/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
