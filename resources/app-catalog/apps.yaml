apps:
  - id: organizer
    name: Organizer
    category: Media workflow
    description: Duyệt staging, khớp TMDb và đề xuất vị trí Plex/Jellyfin.
    container_name: media-organizer
    icon: fa-film
    logo_id: tmdb
    default_port: 8093
    subdomain: media-organizer
    installable: true
    image: ghcr.io/nchungdev/media-organizer:latest
    template: templates/media-organizer.yml

  - id: debrid
    name: Debrid Manager
    category: Download workflow
    description: Quản lý debrid queue; TorBox là một adapter tải cloud.
    container_name: debrid-manager
    container_aliases: [debrid-manager, torbox-worker]
    icon: fa-cloud-arrow-down
    logo_id: torbox
    default_port: 8092
    subdomain: debrid
    installable: true
    image: ghcr.io/nchungdev/debrid-manager:latest
    template: templates/debrid-manager.yml

  - id: rss-hub
    name: RSS Hub
    category: Tools
    description: Multi-source RSS/JSON/Atom feed wrapper cho Threads, communities và web scrapers.
    container_name: rss-hub
    icon: fa-rss
    logo_id: rss
    default_port: 8098
    subdomain: rss
    installable: true
    image: ghcr.io/nchungdev/rss-hub:latest
    template: templates/rss-hub.yml

  - id: rclone
    name: Rclone
    category: Cloud storage
    description: Remote, mount, transfer và Rclone Web GUI.
    container_name: rclone
    icon: fa-cloud-arrow-up
    logo_id: rclone
    default_port: 5572
    subdomain: rclone
    installable: false

  - id: ariang
    name: AriaNg
    category: Download workflow
    description: Giao diện quản lý hàng đợi Aria2.
    container_name: ariang
    icon: fa-download
    logo_id: ariang
    subdomain: ariang
    installable: false

  - id: agent-bridge
    name: Agent Bridge
    category: Automation
    description: Agent Bridge — điều phối Antigravity, Claude Code và Codex.
    container_name: agent-bridge
    container_aliases: [agent-hub, clara, nexus-ai]
    icon: fa-bolt
    logo: /icons/bridge.svg
    logo_id: bridge
    default_port: 8088
    subdomain: agent
    installable: false
