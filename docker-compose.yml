services:
  claraos:
    image: ghcr.io/nchungdev/claraos:latest
    container_name: claraos
    restart: unless-stopped
    ports:
      - "8090:8080"
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Asia/Ho_Chi_Minh
      # Choose which modules to enable on startup (or toggle later via Settings UI)
      - MODULE_AGENTS_ENABLED=true
      - MODULE_APPS_ENABLED=true
      - MODULE_SYNC_ENABLED=true
      - MODULE_ORGANIZER_ENABLED=true
      - MODULE_DEBRID_ENABLED=true
    volumes:
      - ./config:/config
      - /srv/mergerfs/MainPool:/data
      - /var/lib/media-staging:/staging
      # Mount host /proc for Rclone process inspection:
      - /proc:/proc:ro
      # Mount host Docker Socket to enable App Store (Plex, Sonarr, etc.):
      - /var/run/docker.sock:/var/run/docker.sock
